<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Neon Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* شبکه‌ی نئون پس‌زمینه (ظریف) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        /* درخشش پشت متن */
        body::after {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .neon-hero {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 750px;
            padding: 3rem 2rem;
        }

        /* خط نئون بالای عنوان */
        .neon-line-top {
            width: 80px;
            height: 2px;
            background: #06b6d4;
            margin: 0 auto 2rem;
            box-shadow:
                0 0 10px #06b6d4,
                0 0 20px #06b6d4,
                0 0 40px #06b6d4;
            animation: lineGlow 2s ease-in-out infinite alternate;
        }

        .neon-hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            color: #fff;
            letter-spacing: -2px;
            text-shadow:
                0 0 10px rgba(236, 72, 153, 0.8),
                0 0 20px rgba(236, 72, 153, 0.6),
                0 0 40px rgba(236, 72, 153, 0.4),
                0 0 80px rgba(236, 72, 153, 0.2);
            animation: textPulse 3s ease-in-out infinite alternate;
        }

        .neon-hero p {
            font-size: 1.3rem;
            color: #06b6d4;
            margin-bottom: 2rem;
            font-weight: 400;
            text-shadow:
                0 0 10px rgba(6, 182, 212, 0.6),
                0 0 20px rgba(6, 182, 212, 0.3);
            letter-spacing: 0.5px;
        }

        /* خط نئون وسط */
        .neon-line-mid {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ec4899, #06b6d4, transparent);
            margin: 0 auto 2rem;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .badge {
            background: transparent;
            padding: 0.6rem 1.3rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #06b6d4;
            border: 1px solid #06b6d4;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow:
                0 0 10px rgba(6, 182, 212, 0.2),
                inset 0 0 10px rgba(6, 182, 212, 0.05);
            position: relative;
        }

        .badge:hover {
            color: #000;
            background: #06b6d4;
            box-shadow:
                0 0 20px rgba(6, 182, 212, 0.8),
                0 0 40px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        @keyframes lineGlow {
            from { box-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4, 0 0 40px #06b6d4; }
            to { box-shadow: 0 0 20px #06b6d4, 0 0 40px #06b6d4, 0 0 80px #06b6d4; }
        }

        @keyframes textPulse {
            from { text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.6), 0 0 40px rgba(236, 72, 153, 0.4), 0 0 80px rgba(236, 72, 153, 0.2); }
            to { text-shadow: 0 0 15px rgba(236, 72, 153, 1), 0 0 30px rgba(236, 72, 153, 0.8), 0 0 60px rgba(236, 72, 153, 0.6), 0 0 120px rgba(236, 72, 153, 0.4); }
        }

        @media (max-width: 600px) {
            .neon-hero h1 { font-size: 2.5rem; letter-spacing: -1px; }
            .neon-hero p { font-size: 1rem; }
            .badge { font-size: 0.75rem; padding: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="neon-hero">
        <div class="neon-line-top"></div>
        <h1>🎙️ VoiceSage</h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <div class="neon-line-mid"></div>
        <div class="badges">
            <span class="badge">دقت بالا</span>
            <span class="badge">فارسی + انگلیسی</span>
            <span class="badge">ترجمه</span>
            <span class="badge">دانلود</span>
        </div>
    </div>
</body>
</html>
