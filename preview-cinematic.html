<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Cinematic Spotlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #050505;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* نورافکن سینمایی - اشعه‌ی مورب */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 20%;
            width: 80%;
            height: 160%;
            background: linear-gradient(
                115deg,
                transparent 0%,
                transparent 40%,
                rgba(99, 102, 241, 0.08) 45%,
                rgba(139, 92, 246, 0.15) 50%,
                rgba(99, 102, 241, 0.08) 55%,
                transparent 60%,
                transparent 100%
            );
            transform: rotate(-8deg);
            z-index: 0;
            pointer-events: none;
        }

        /* نورافکن دوم - از سمت راست */
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 140%;
            background: linear-gradient(
                245deg,
                transparent 0%,
                transparent 45%,
                rgba(236, 72, 153, 0.06) 50%,
                transparent 55%,
                transparent 100%
            );
            transform: rotate(10deg);
            z-index: 0;
            pointer-events: none;
        }

        /* گرین / نویز سینمایی */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.15;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* وینیت - تاریکی اطراف */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 40%,
                rgba(0, 0, 0, 0.4) 80%,
                rgba(0, 0, 0, 0.9) 100%
            );
        }

        /* محتوای Hero */
        .cinematic-hero {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 700px;
            padding: 3rem 2rem;
            animation: heroIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* خط بالا */
        .eyebrow {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(165, 180, 252, 0.6);
            margin-bottom: 1.5rem;
            font-weight: 500;
            position: relative;
        }
        .eyebrow::before,
        .eyebrow::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 1px;
            background: rgba(165, 180, 252, 0.3);
            vertical-align: middle;
            margin: 0 12px;
        }

        .cinematic-hero h1 {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0 0 0.5rem 0;
            color: #ffffff;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow:
                0 0 80px rgba(139, 92, 246, 0.4),
                0 0 120px rgba(99, 102, 241, 0.2);
        }

        .cinematic-hero h1 span {
            background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cinematic-hero p {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.55);
            margin: 1.5rem 0 2.5rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem 1.1rem;
            border-radius: 4px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
        }

        .badge:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
            color: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        @keyframes heroIn {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @media (max-width: 600px) {
            .cinematic-hero h1 { font-size: 2.8rem; letter-spacing: -1px; }
            .cinematic-hero p { font-size: 0.95rem; }
            .eyebrow { font-size: 0.65rem; letter-spacing: 3px; }
            .badge { font-size: 0.7rem; padding: 0.4rem 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="cinematic-hero">
        <div class="eyebrow">Voice to Text AI</div>
        <h1><span>🎙️ VoiceSage</span></h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <div class="badges">
            <span class="badge">دقت بالا</span>
            <span class="badge">فارسی + انگلیسی</span>
            <span class="badge">ترجمه</span>
            <span class="badge">دانلود</span>
        </div>
    </div>
</body>
</html>
