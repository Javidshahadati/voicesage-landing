<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Minimalist Neutral</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
            color: #000;
        }

        /* خطوط عمودی ظریف (grid) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 25% 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* خط افقی وسط */
        .divider-line {
            position: fixed;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e5e5;
            z-index: 0;
            pointer-events: none;
        }

        /* Hero */
        .minimal-hero {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 3rem 2rem;
            animation: heroIn 1s ease-out;
        }

        /* شماره‌ی کوچک بالا */
        .index-label {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 3rem;
        }
        .index-label::before,
        .index-label::after {
            content: '';
            width: 40px;
            height: 1px;
            background: #d4d4d4;
        }

        /* عنوان اصلی - خیلی بزرگ */
        .minimal-hero h1 {
            font-size: 6rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -4px;
            line-height: 0.95;
            color: #000;
        }

        .minimal-hero h1 .accent {
            color: #999;
            font-weight: 200;
        }

        /* زیرعنوان */
        .minimal-hero .subtitle {
            font-size: 1.05rem;
            color: #666;
            margin-top: 2rem;
            font-weight: 300;
            line-height: 1.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            letter-spacing: 0.2px;
        }

        /* خط جداکننده */
        .hr {
            width: 40px;
            height: 1px;
            background: #000;
            margin: 3rem auto;
        }

        /* بج‌ها - خیلی ظریف */
        .badges {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.78rem;
            color: #000;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 8px;
            cursor: default;
            transition: color 0.3s;
        }

        .badge::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 1px;
            background: #000;
            transition: width 0.3s ease;
        }

        .badge:hover::after {
            width: 100%;
        }

        /* CTA پایین */
        .cta-row {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
        }
        .cta-minimal {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 0;
            color: #000;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            transition: gap 0.3s ease;
        }
        .cta-minimal:hover {
            gap: 16px;
        }

        /* شماره‌ی پایین صفحه (سبک مجله) */
        .page-number {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.72rem;
            color: #999;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .page-number-r {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 0.72rem;
            color: #999;
            letter-spacing: 2px;
            font-weight: 500;
        }

        @keyframes heroIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .minimal-hero h1 { font-size: 3.5rem; letter-spacing: -2px; }
            .minimal-hero .subtitle { font-size: 0.9rem; }
            .badges { gap: 1.2rem; }
            .badge { font-size: 0.65rem; letter-spacing: 1.5px; }
            .index-label { font-size: 0.65rem; letter-spacing: 2px; }
            .page-number, .page-number-r { display: none; }
        }
    </style>
</head>
<body>
    <div class="divider-line"></div>

    <div class="minimal-hero">
        <div class="index-label">Voice AI &nbsp;·&nbsp; 2026</div>
        <h1>Voice<span class="accent">Sage</span></h1>
        <p class="subtitle">صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <div class="hr"></div>
        <div class="badges">
            <span class="badge">دقت بالا</span>
            <span class="badge">دوزبانه</span>
            <span class="badge">ترجمه</span>
            <span class="badge">دانلود</span>
        </div>
        <div class="cta-row">
            <a href="#" class="cta-minimal">شروع رایگان ←</a>
        </div>
    </div>

    <div class="page-number">01 / 01</div>
    <div class="page-number-r">VoiceSage.io</div>
</body>
</html>
