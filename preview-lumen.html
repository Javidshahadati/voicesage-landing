<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Lumen / Linear</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* گرید ظریف پس‌زمینه */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
            z-index: 0;
            pointer-events: none;
        }

        /* نور مایع پشت عنوان */
        .lumen-orb {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -60%);
            width: 700px; height: 700px;
            background: radial-gradient(
                circle,
                rgba(99, 102, 241, 0.25) 0%,
                rgba(139, 92, 246, 0.15) 30%,
                transparent 70%
            );
            filter: blur(60px);
            z-index: 0;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(-50%, -60%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -55%) scale(1.15); opacity: 1; }
        }

        /* اسپات‌لایت ماوس (CSS-only با یک نقطه مرکزی) */
        .mouse-spotlight {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        /* Hero */
        .lumen-hero {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 720px;
            padding: 3rem 2rem;
            animation: heroIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* بج بالا - pill */
        .top-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.65);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .top-pill:hover {
            border-color: rgba(139,92,246,0.3);
            background: rgba(139,92,246,0.06);
        }
        .top-pill .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* عنوان اصلی */
        .lumen-hero h1 {
            font-size: 4.2rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -2px;
            line-height: 1.05;
            background: linear-gradient(180deg, #ffffff 0%, #c7d2fe 60%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lumen-hero p {
            font-size: 1.15rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 2rem;
            font-weight: 300;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }

        /* دکمه‌ی CTA */
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(165,180,252,0.3);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 2.5rem;
            box-shadow:
                0 4px 20px rgba(99,102,241,0.4),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transition: all 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 30px rgba(99,102,241,0.6),
                inset 0 1px 0 rgba(255,255,255,0.15);
        }

        /* بج‌های پایین */
        .badges {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .badge {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(139,92,246,0.8);
            box-shadow: 0 0 8px rgba(139,92,246,0.8);
        }

        @keyframes heroIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @media (max-width: 600px) {
            .lumen-hero h1 { font-size: 2.6rem; letter-spacing: -1px; }
            .lumen-hero p { font-size: 0.95rem; }
            .badges { gap: 1rem; }
            .badge { font-size: 0.75rem; }
            .lumen-orb { width: 450px; height: 450px; }
        }
    </style>
</head>
<body>
    <div class="lumen-orb"></div>
    <div class="mouse-spotlight"></div>

    <div class="lumen-hero">
        <div class="top-pill">
            <span class="dot"></span>
            <span>Powered by AI</span>
        </div>
        <h1>🎙️ VoiceSage</h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <a href="#" class="cta-button">شروع رایگان ←</a>
        <div class="badges">
            <span class="badge">دقت بالا</span>
            <span class="badge">فارسی + انگلیسی</span>
            <span class="badge">ترجمه</span>
            <span class="badge">دانلود</span>
        </div>
    </div>
</body>
</html>
