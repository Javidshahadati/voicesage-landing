<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wispr Flow Design Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fcfcf0; /* رنگ پس‌زمینه کرمی عکس */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 1000px;
            height: 500px;
            /* برای دیدن بهتر، یه حاشیه بهش میدیم */
            /* border: 1px solid #eee;  */
        }

        /* ====== متن‌های دور دایره سمت چپ ====== */
        .circle-text-svg {
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 500px;
            height: 500px;
            z-index: 1;
        }
        .circle-text-svg text {
            fill: #d1d1d1;
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* ====== دکمه سبز بالای موج ====== */
        .saved-btn {
            position: absolute;
            left: 45%;
            top: 120px;
            transform: translateX(-50%);
            background-color: #1b5748; /* سبز تیره */
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            z-index: 3;
        }

        /* ====== کادر موج صوتی وسط ====== */
        .waveform-box {
            position: absolute;
            left: 45%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 90px;
            background-color: #fcfcf0;
            border: 2px solid #000;
            border-radius: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 50px;
        }

        .waveform span {
            display: block;
            width: 4px;
            background-color: #000;
            border-radius: 2px;
            animation: waveAnim 1.2s ease-in-out infinite alternate;
        }

        /* شبیه‌سازی موج طبیعی با تاخیر متفاوت برای هر خط */
        .waveform span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .waveform span:nth-child(2) { height: 25px; animation-delay: 0.3s; }
        .waveform span:nth-child(3) { height: 40px; animation-delay: 0.0s; }
        .waveform span:nth-child(4) { height: 15px; animation-delay: 0.4s; }
        .waveform span:nth-child(5) { height: 30px; animation-delay: 0.2s; }
        .waveform span:nth-child(6) { height: 45px; animation-delay: 0.5s; }
        .waveform span:nth-child(7) { height: 20px; animation-delay: 0.1s; }
        .waveform span:nth-child(8) { height: 35px; animation-delay: 0.4s; }
        .waveform span:nth-child(9) { height: 10px; animation-delay: 0.2s; }
        .waveform span:nth-child(10) { height: 25px; animation-delay: 0.3s; }
        .waveform span:nth-child(11) { height: 15px; animation-delay: 0.0s; }
        
        /* خطوط ریز وسط (نقطه چین) */
        .waveform span.dot { height: 4px; width: 4px; background-color: #666; margin: 0 2px; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.5); }
            100% { transform: scaleY(1.2); }
        }

        /* ====== روبان مشکی سمت راست ====== */
        .ribbon-svg {
            position: absolute;
            right: -50px;
            top: 35%;
            width: 700px;
            height: 300px;
            z-index: 1;
        }
        
        /* متن داخل روبان */
        .ribbon-svg text {
            fill: #ffffff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- متن‌های دور دایره -->
        <svg class="circle-text-svg" viewBox="0 0 500 500">
            <defs>
                <path id="circlePath" d="M 250, 250 m -180, 0 a 180,180 0 1,1 360,0 a 180,180 0 1,1 -360,0" />
            </defs>
            <text>
                <textPath href="#circlePath" startOffset="10%">
                    I was talking to Cheyenne earlier but...
                </textPath>
            </text>
        </svg>

        <!-- دکمه بالای موج -->
        <div class="saved-btn">Saved name</div>

        <!-- کادر موج صوتی -->
        <div class="waveform-box">
            <div class="waveform">
                <span></span><span></span><span></span><span></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span></span><span></span><span></span><span></span>
            </div>
        </div>

        <!-- روبان مشکی با متن -->
        <svg class="ribbon-svg" viewBox="0 0 800 300">
            <defs>
                <!-- مسیر روبان -->
                <path id="ribbonPath" d="M 0,150 Q 200,150 400,100 T 800,50" fill="none" stroke="#1c1c1c" stroke-width="80" stroke-linecap="round"/>
                <!-- مسیر متن داخل روبان (کمی بالاتر از مرکز روبان) -->
                <path id="textPath" d="M 50,140 Q 200,140 400,90 T 800,40" fill="none" />
            </defs>
            <!-- خود روبان مشکی -->
            <use href="#ribbonPath" />
            <!-- متن سفید روی روبان -->
            <text>
                <textPath href="#textPath" startOffset="10%">
                    Cheyenne earlier, but the...
                </textPath>
            </text>
        </svg>

    </div>

</body>
</html>
