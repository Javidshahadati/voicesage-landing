<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wispr Flow Design Preview - V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fcfcf5; /* رنگ کرمی دقیق تر */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 1000px;
            height: 600px;
        }

        /* ====== ۱. متن‌های دور دایره سمت چپ ====== */
        .circle-text-svg {
            position: absolute;
            left: -100px;
            top: 40%;
            transform: translateY(-50%);
            width: 600px;
            height: 600px;
            z-index: 1;
        }
        .circle-text-svg text {
            fill: #d8d8d8; /* خاکستری محو */
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ====== ۲. کادر موج صوتی و دکمه (وسط) ====== */
        .center-group {
            position: absolute;
            left: 45%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .saved-btn {
            background-color: #1c5a48; /* سبز تیره */
            color: #fff;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .waveform-box {
            width: 200px;
            height: 100px;
            background-color: #fcfcf5;
            border: 2px solid #111;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 50px;
        }

        .waveform span {
            display: block;
            width: 3px;
            background-color: #111;
            border-radius: 2px;
            animation: waveAnim 1s ease-in-out infinite alternate;
        }

        /* ساخت موج شبیه به عکس اصلی */
        .waveform span:nth-child(1) { height: 20px; animation-delay: 0.1s; }
        .waveform span:nth-child(2) { height: 35px; animation-delay: 0.3s; }
        .waveform span:nth-child(3) { height: 15px; animation-delay: 0.0s; }
        .waveform span:nth-child(4) { height: 40px; animation-delay: 0.4s; }
        .waveform span:nth-child(5) { height: 25px; animation-delay: 0.2s; }
        .waveform span:nth-child(6) { height: 45px; animation-delay: 0.5s; }
        
        /* نقطه چین وسط */
        .waveform span.dot { height: 3px; width: 3px; background-color: #111; margin: 0 2px; animation: none; }
        
        .waveform span:nth-child(10) { height: 30px; animation-delay: 0.1s; }
        .waveform span:nth-child(11) { height: 45px; animation-delay: 0.4s; }
        .waveform span:nth-child(12) { height: 25px; animation-delay: 0.2s; }
        .waveform span:nth-child(13) { height: 35px; animation-delay: 0.3s; }
        .waveform span:nth-child(14) { height: 15px; animation-delay: 0.0s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.6); opacity: 0.7; }
            100% { transform: scaleY(1.1); opacity: 1; }
        }

        /* ====== ۳. روبان مشکی سمت راست ====== */
        .ribbon-svg {
            position: absolute;
            right: -100px;
            top: 20%;
            width: 800px;
            height: 400px;
            z-index: 2; /* از موج پایین‌تره که انگار از پشتش رد میشه */
        }
        
        .ribbon-svg text {
            fill: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- دایره متن‌های محو -->
        <svg class="circle-text-svg" viewBox="0 0 600 600">
            <defs>
                <!-- یه مسیر دایره‌ای کامل -->
                <path id="circlePath" d="M 300, 300 m -220, 0 a 220,220 0 1,1 440,0 a 220,220 0 1,1 -440,0" />
            </defs>
            <text>
                <textPath href="#circlePath" startOffset="5%">
                    was talking to Cheyenne earlier but...
                </textPath>
            </text>
        </svg>

        <!-- گروه وسط (دکمه + موج) -->
        <div class="center-group">
            <div class="saved-btn">Saved name</div>
            <div class="waveform-box">
                <div class="waveform">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- روبان مشکی -->
        <svg class="ribbon-svg" viewBox="0 0 1000 500">
            <defs>
                <!-- مسیر روبان با خمیدگی طبیعی تر (S-Curve) -->
                <path id="ribbonPath" d="M 0,250 C 250,250 350,150 600,150 C 800,150 900,200 1000,150" fill="none" stroke="#151515" stroke-width="90" stroke-linecap="round"/>
                
                <!-- مسیر متن (کمی بالاتر از مرکز روبان) -->
                <path id="textPath" d="M 50,240 C 250,240 350,140 600,140 C 800,140 900,190 950,140" fill="none" />
            </defs>
            
            <!-- رسم روبان -->
            <use href="#ribbonPath" />
            
            <!-- متن روی روبان -->
            <text>
                <textPath href="#textPath" startOffset="5%">
                    /ene earlier, but the...
                </textPath>
            </text>
        </svg>

    </div>

</body>
</html>
