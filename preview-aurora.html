<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Aurora Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* Aurora background */
        .aurora-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s ease-in-out infinite;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: #1e40af;
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: #7c3aed;
            top: 20%; right: -10%;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 450px; height: 450px;
            background: #db2777;
            bottom: -15%; left: 20%;
            animation-delay: -10s;
        }
        .blob-4 {
            width: 350px; height: 350px;
            background: #06b6d4;
            bottom: 10%; right: 15%;
            animation-delay: -15s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Hero */
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 700px;
            padding: 3rem 2rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .hero h1 {
            font-size: 3.8rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(165,180,252,0.5);
        }
        .hero p {
            font-size: 1.35rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            font-weight: 400;
            color: #e0e7ff;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(255,255,255,0.08);
            padding: 0.75rem 1.4rem;
            border-radius: 28px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            font-weight: 600;
            color: #e0e7ff;
            transition: all 0.3s;
        }
        .badge:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-4px) scale(1.05);
            border-color: rgba(165,180,252,0.5);
            box-shadow: 0 0 30px rgba(165,180,252,0.3);
        }
    </style>
</head>
<body>

    <div class="aurora-container">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
        <div class="aurora-blob blob-4"></div>
    </div>

    <div class="hero">
        <h1>🎙️ VoiceSage</h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <div class="badges">
            <span class="badge">🎯 دقت بالا</span>
            <span class="badge">🌐 فارسی + انگلیسی</span>
            <span class="badge">🔄 ترجمه</span>
            <span class="badge">📥 دانلود</span>
        </div>
    </div>

</body>
</html>
