<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Aurora Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* Aurora background */
        .aurora-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .aurora-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.9;
    animation: float 6s ease-in-out infinite;
    will-change: transform;
        }
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            top: -15%; left: -15%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #a855f7 0%, transparent 70%);
            top: 15%; right: -15%;
            animation-delay: -3s;
        }
        .blob-3 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            bottom: -20%; left: 15%;
            animation-delay: -6s;
        }
        .blob-4 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            bottom: 5%; right: 10%;
            animation-delay: -9s;
        }
        @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(120px, -100px) scale(1.3); }
    50% { transform: translate(-80px, 120px) scale(0.75); }
    75% { transform: translate(100px, 80px) scale(1.25); }
        }
        }

        /* Hero */
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 700px;
            padding: 3rem 2rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: heroFadeIn 1s ease-out;
        }
        .hero h1 {
            font-size: 3.8rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 30px rgba(165,180,252,0.5));
        }
        .hero p {
            font-size: 1.35rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            font-weight: 400;
            color: #e0e7ff;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(255,255,255,0.08);
            padding: 0.75rem 1.4rem;
            border-radius: 28px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            font-weight: 600;
            color: #e0e7ff;
            transition: all 0.3s;
        }
        .badge:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-4px) scale(1.05);
            border-color: rgba(165,180,252,0.5);
            box-shadow: 0 0 30px rgba(165,180,252,0.3);
        }
        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.5rem; }
            .hero p { font-size: 1.1rem; }
            .hero { padding: 2rem 1.25rem; }
            .blob-1, .blob-2, .blob-3, .blob-4 { filter: blur(30px); }
        }
    </style>
</head>
<body>

    <div class="aurora-container">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
        <div class="aurora-blob blob-4"></div>
    </div>

    <div class="hero">
        <h1>🎙️ VoiceSage</h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <div class="badges">
            <span class="badge">🎯 دقت بالا</span>
            <span class="badge">🌐 فارسی + انگلیسی</span>
            <span class="badge">🔄 ترجمه</span>
            <span class="badge">📥 دانلود</span>
        </div>
    </div>

</body>
</html>
