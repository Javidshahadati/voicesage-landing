<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Liquid Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0612;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* حباب‌های رنگی توی پس‌زمینه (که از پشت شیشه دیده می‌شن) */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.7;
            animation: blobFloat 12s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        .bg-1 {
            width: 500px; height: 500px;
            background: #6366f1;
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .bg-2 {
            width: 450px; height: 450px;
            background: #ec4899;
            bottom: -15%; right: -10%;
            animation-delay: -4s;
        }
        .bg-3 {
            width: 400px; height: 400px;
            background: #06b6d4;
            top: 30%; right: 20%;
            animation-delay: -8s;
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -60px) scale(1.15); }
        }

        /* کارت شیشه‌ای مایع */
        .liquid-card {
            position: relative;
            z-index: 1;
            max-width: 680px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            border-radius: 42px;
            text-align: center;
            color: white;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.14) 0%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.10) 100%
            );
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.5),
                0 10px 40px rgba(99, 102, 241, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1),
                inset 0 0 80px rgba(255, 255, 255, 0.03);
            animation: cardFloat 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* نور بالای کارت (انعکاس) */
        .liquid-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1.5px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%
            );
            border-radius: 2px;
        }

        /* درخشش داخلی */
        .liquid-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at 30% 20%,
                rgba(255, 255, 255, 0.08) 0%,
                transparent 40%
            );
            pointer-events: none;
        }

        /* محتوا */
        .liquid-card > * {
            position: relative;
            z-index: 2;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
            letter-spacing: 1px;
            font-weight: 500;
        }
        .pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .liquid-card h1 {
            font-size: 3.6rem;
            font-weight: 900;
            margin: 0 0 0.5rem 0;
            letter-spacing: -2px;
            line-height: 1.05;
            background: linear-gradient(
                180deg,
                #ffffff 0%,
                rgba(255, 255, 255, 0.75) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 30px rgba(255, 255, 255, 0.15);
            filter: drop-shadow(0 2px 10px rgba(99, 102, 241, 0.3));
        }

        .liquid-card p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 0.2px;
        }

        /* دکمه‌ی شیشه‌ای */
        .btn-glass {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0.1) 100%
            );
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Vazirmatn', sans-serif;
            margin-bottom: 2.5rem;
            cursor: pointer;
        }
        .btn-glass:hover {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.15) 100%
            );
            transform: translateY(-3px);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* بج‌ها - شیشه‌ای کوچیک */
        .badges {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1.1rem;
            border-radius: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .badge:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        @keyframes cardFloat {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
                filter: blur(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @media (max-width: 600px) {
            .liquid-card {
                padding: 2.5rem 1.5rem;
                border-radius: 32px;
            }
            .liquid-card h1 { font-size: 2.4rem; }
            .liquid-card p { font-size: 0.95rem; }
            .btn-glass { padding: 12px 24px; font-size: 0.85rem; }
            .badge { font-size: 0.7rem; padding: 0.4rem 0.9rem; }
            .bg-blob { filter: blur(50px); }
        }
    </style>
</head>
<body>
    <div class="bg-blob bg-1"></div>
    <div class="bg-blob bg-2"></div>
    <div class="bg-blob bg-3"></div>

    <div class="liquid-card">
        <div class="pill">
            <span class="dot"></span>
            <span>LIVE · AI POWERED</span>
        </div>
        <h1>🎙️ VoiceSage</h1>
        <p>صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
        <a href="#" class="btn-glass">شروع رایگان ←</a>
        <div class="badges">
            <span class="badge">🎯 دقت بالا</span>
            <span class="badge">🌐 دوزبانه</span>
            <span class="badge">🔄 ترجمه</span>
            <span class="badge">📥 دانلود</span>
        </div>
    </div>
</body>
</html>
