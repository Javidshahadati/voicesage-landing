<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — Hybrid (Neon + Bento + Aurora)</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 3rem 1.5rem;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== AURORA: حباب‌های شناور توی پس‌زمینه ========== */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: auroraFloat 10s ease-in-out infinite;
            will-change: transform;
        }
        .blob-1 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            top: -15%; left: -10%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 5%; right: -15%;
            animation-delay: -3s;
        }
        .blob-3 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #a855f7 0%, transparent 70%);
            bottom: -15%; left: 15%;
            animation-delay: -6s;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, -80px) scale(1.2); }
        }

        /* ========== NEON: گرید ظریف پس‌زمینه ========== */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 20%, transparent 75%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ========== HERO: سبک نئون ========== */
        .hero {
            text-align: center;
            padding: 2rem 0 3rem;
            position: relative;
        }

        .neon-line-top {
            width: 90px;
            height: 2px;
            background: #06b6d4;
            margin: 0 auto 2rem;
            box-shadow:
                0 0 10px #06b6d4,
                0 0 25px #06b6d4,
                0 0 50px #06b6d4;
            animation: neonPulse 2s ease-in-out infinite alternate;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -3px;
            line-height: 1;
            color: #fff;
            text-shadow:
                0 0 10px rgba(236, 72, 153, 0.9),
                0 0 25px rgba(236, 72, 153, 0.6),
                0 0 50px rgba(236, 72, 153, 0.4),
                0 0 100px rgba(236, 72, 153, 0.2);
        }

        .hero .subtitle {
            font-size: 1.4rem;
            color: #06b6d4;
            margin: 1.2rem 0 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.7;
            text-shadow:
                0 0 10px rgba(6, 182, 212, 0.6),
                0 0 25px rgba(6, 182, 212, 0.3);
        }

        .neon-line-mid {
            width: 100%;
            max-width: 500px;
            height: 1px;
            margin: 0 auto 2rem;
            background: linear-gradient(90deg, transparent, #ec4899, #06b6d4, #a855f7, transparent);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        /* ========== BENTO GRID ========== */
        .bento {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(130px, auto);
            gap: 12px;
            margin-top: 1rem;
        }

        .tile {
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: 18px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: tileIn 0.8s ease-out backwards;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tile::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.5), transparent);
        }

        .tile:nth-child(1) { animation-delay: 0.1s; }
        .tile:nth-child(2) { animation-delay: 0.15s; }
        .tile:nth-child(3) { animation-delay: 0.2s; }
        .tile:nth-child(4) { animation-delay: 0.25s; }
        .tile:nth-child(5) { animation-delay: 0.3s; }
        .tile:nth-child(6) { animation-delay: 0.35s; }
        .tile:nth-child(7) { animation-delay: 0.4s; }

        .tile:hover {
            border-color: rgba(236, 72, 153, 0.5);
            background: rgba(20, 10, 30, 0.85);
            transform: translateY(-4px);
            box-shadow:
                0 15px 40px rgba(236, 72, 153, 0.15),
                0 0 0 1px rgba(236, 72, 153, 0.2),
                inset 0 0 30px rgba(236, 72, 153, 0.05);
        }

        .tile-large { grid-column: span 2; grid-row: span 2; }
        .tile-wide { grid-column: span 2; }
        .tile-tall { grid-row: span 2; }

        .tile-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.5));
        }
        .tile-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            line-height: 1.5;
        }
        .tile-desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 300;
            line-height: 1.8;
        }

        /* کارت اصلی */
        .tile-main {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(236, 72, 153, 0.08) 100%);
            border-color: rgba(168, 85, 247, 0.35);
        }
        .tile-main::before {
            background: linear-gradient(90deg, transparent, rgba(236, 72, 153, 0.7), transparent);
        }
        .tile-main .tile-title {
            font-size: 2rem;
            line-height: 1.3;
            background: linear-gradient(180deg, #fff 0%, #a5b4fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.4));
        }
        .tile-main .tile-desc {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
        }
        .tile-main::after {
            content: '';
            position: absolute;
            top: -50%; right: -30%;
            width: 60%; height: 200%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, transparent 60%);
            pointer-events: none;
        }

        /* کارت آمار */
        .tile-stat {
            text-align: center;
            justify-content: center;
            align-items: center;
        }
        .stat-number {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: #06b6d4;
            text-shadow:
                0 0 10px rgba(6, 182, 212, 0.9),
                0 0 25px rgba(6, 182, 212, 0.6),
                0 0 50px rgba(6, 182, 212, 0.3);
        }
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 0.6rem;
            letter-spacing: 1.5px;
        }

        /* کارت CTA */
        .tile-cta {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border-color: rgba(236, 72, 153, 0.4);
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .tile-cta .tile-title {
            font-size: 1.3rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }
        .tile-cta .arrow {
            font-size: 1.7rem;
            color: #06b6d4;
            margin-top: 0.5rem;
            text-shadow: 0 0 15px #06b6d4;
            transition: transform 0.3s;
        }
        .tile-cta:hover .arrow {
            transform: translateX(-5px);
        }
        .tile-cta:hover {
            box-shadow:
                0 15px 40px rgba(236, 72, 153, 0.3),
                0 0 0 1px rgba(236, 72, 153, 0.5);
        }

        /* کارت Wave */
        .tile-wave {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(168, 85, 247, 0.08) 100%);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .wave-lines {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 40px;
            margin-top: 0.8rem;
        }
        .wave-lines span {
            flex: 1;
            background: linear-gradient(180deg, #06b6d4, #a855f7);
            border-radius: 2px;
            animation: wave 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }
        .wave-lines span:nth-child(1) { height: 40%; animation-delay: 0s; }
        .wave-lines span:nth-child(2) { height: 70%; animation-delay: 0.1s; }
        .wave-lines span:nth-child(3) { height: 100%; animation-delay: 0.2s; }
        .wave-lines span:nth-child(4) { height: 60%; animation-delay: 0.3s; }
        .wave-lines span:nth-child(5) { height: 85%; animation-delay: 0.4s; }
        .wave-lines span:nth-child(6) { height: 45%; animation-delay: 0.5s; }
        .wave-lines span:nth-child(7) { height: 90%; animation-delay: 0.6s; }
        .wave-lines span:nth-child(8) { height: 55%; animation-delay: 0.7s; }

        @keyframes wave {
            0%, 100% { opacity: 1; transform: scaleY(1); }
            50% { opacity: 0.5; transform: scaleY(0.6); }
        }

        /* کارت زبان‌ها */
        .lang-row {
            display: flex;
            gap: 6px;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .lang-chip {
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .lang-chip.active {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.5);
            color: #67e8f9;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        @keyframes tileIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes neonPulse {
            from { box-shadow: 0 0 10px #06b6d4, 0 0 25px #06b6d4, 0 0 50px #06b6d4; }
            to { box-shadow: 0 0 15px #06b6d4, 0 0 35px #06b6d4, 0 0 70px #06b6d4; }
        }

        /* ========== ریسپانسیو ========== */
        @media (max-width: 900px) {
            .bento { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            body { padding: 2rem 1rem; }
            .hero h1 { font-size: 2.8rem; letter-spacing: -1.5px; }
            .hero .subtitle { font-size: 1.1rem; }
            .bento {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .tile-large, .tile-wide, .tile-tall {
                grid-column: span 1;
                grid-row: span 1;
            }
            .tile { padding: 1.25rem; }
            .tile-title { font-size: 1.15rem; }
            .tile-desc { font-size: 0.95rem; }
            .stat-number { font-size: 2rem; }
            .tile-main .tile-title { font-size: 1.5rem; }
            .tile-main .tile-desc { font-size: 1rem; }
            .tile-cta .tile-title { font-size: 1.15rem; }
            .aurora-blob { filter: blur(60px); }
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <div class="grid-bg"></div>

    <div class="container">
        <div class="hero">
            <div class="neon-line-top"></div>
            <h1>🎙️ VoiceSage</h1>
            <p class="subtitle">صدا را به متن تبدیل کن — دقیق، سریع، حرفه‌ای</p>
            <div class="neon-line-mid"></div>
        </div>

        <div class="bento">
            <div class="tile tile-large tile-main">
                <div>
                    <div class="tile-icon">🎙️</div>
                    <div class="tile-title">تبدیل صدا به متن</div>
                    <div class="tile-desc">با دقت ۹۵٪ و سرعت بالا. فارسی، انگلیسی، و زبان‌های بیشتر.</div>
                </div>
            </div>

            <div class="tile tile-stat">
                <div class="stat-number">۹۵٪</div>
                <div class="stat-label">دقت</div>
            </div>

            <div class="tile tile-stat">
                <div class="stat-number">&lt;۱۵s</div>
                <div class="stat-label">سرعت</div>
            </div>

            <div class="tile tile-wide">
                <div>
                    <div class="tile-icon">🌐</div>
                    <div class="tile-title">دوزبانه + ترجمه</div>
                    <div class="tile-desc">فارسی و انگلیسی</div>
                </div>
                <div class="lang-row">
                    <span class="lang-chip active">🇮🇷 فارسی</span>
                    <span class="lang-chip active">🇬🇧 English</span>
                    <span class="lang-chip">عربی</span>
                    <span class="lang-chip">ترکی</span>
                </div>
            </div>

            <div class="tile tile-wide tile-wave">
                <div>
                    <div class="tile-title">تشخیص خودکار</div>
                    <div class="tile-desc">زبان و کلمات کلیدی</div>
                </div>
                <div class="wave-lines">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="tile tile-cta">
                <div class="tile-title">شروع رایگان</div>
                <div class="arrow">←</div>
            </div>

            <div class="tile">
                <div>
                    <div class="tile-icon">📥</div>
                    <div class="tile-title">دانلود</div>
                    <div class="tile-desc">TXT، SRT، VTT</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
